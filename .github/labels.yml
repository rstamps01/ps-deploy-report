# Canonical issue/PR labels for this repository.
# Apply with a label-sync action or `gh label create`. The security.yml workflow
# expects the "security" label to exist (it also creates it on demand).

# Types
- name: "bug"
  color: "d73a4a"
  description: "A defect in the product"
- name: "enhancement"
  color: "a2eeef"
  description: "New feature or request (FEAT)"
- name: "chore"
  color: "fef2c0"
  description: "Maintenance, tooling, non-user-facing"
- name: "docs"
  color: "0075ca"
  description: "Documentation only"

# Workflow / process
- name: "security"
  color: "b60205"
  description: "Security finding or scan result (used by security.yml)"
- name: "dependencies"
  color: "0366d6"
  description: "Dependency updates (Dependabot)"
- name: "ci"
  color: "1d76db"
  description: "CI/CD pipeline and workflows"
- name: "blocked"
  color: "e11d21"
  description: "Blocked on an external dependency or decision"
- name: "needs-triage"
  color: "ededed"
  description: "Awaiting classification/prioritization"

# Priority
- name: "P0"
  color: "b60205"
  description: "Critical"
- name: "P1"
  color: "d93f0b"
  description: "High"
- name: "P2"
  color: "fbca04"
  description: "Medium"
- name: "P3"
  color: "0e8a16"
  description: "Low"
