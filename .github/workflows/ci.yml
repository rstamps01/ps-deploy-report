name: CI

on:
  push:
    branches: [develop, main, "feature/*", "fix/*"]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  # Superseded runs are cancelled on every ref except main. A release merge puts
  # the same commit on main, develop and the tag at once, and check-suites attach
  # to the SHA rather than the triggering ref — so a cancelled develop run would
  # otherwise surface as a red X on the released commit's main banner.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # -------------------------------------------------------------------
  # Job 0: Todo/roadmap list validation — ensure planned work is tracked
  # -------------------------------------------------------------------
  todo-list-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate TODO-ROADMAP exists and has required structure
        run: |
          ROADMAP=docs/TODO-ROADMAP.md
          if [ ! -f "$ROADMAP" ]; then
            echo "::error file=$ROADMAP::docs/TODO-ROADMAP.md is missing. Create it and track planned items (see .cursor/rules/todo-tracking-09.mdc)."
            exit 1
          fi
          if ! grep -qE "TODO-ROADMAP|TODO & Roadmap" "$ROADMAP"; then
            echo "::error file=$ROADMAP::docs/TODO-ROADMAP.md must contain a title (TODO-ROADMAP or TODO & Roadmap)."
            exit 1
          fi
          if ! grep -q "Last updated" "$ROADMAP"; then
            echo "::error file=$ROADMAP::docs/TODO-ROADMAP.md must contain 'Last updated' for status maintenance."
            exit 1
          fi
          if ! grep -qE "## (Planned|Next steps|In progress|Done)" "$ROADMAP"; then
            echo "::error file=$ROADMAP::docs/TODO-ROADMAP.md must contain at least one of: ## Planned, ## Next steps, ## In progress, ## Done."
            exit 1
          fi
          echo "Todo list validation passed."

  # -------------------------------------------------------------------
  # Job 1: Code quality checks (fast gate — Linux only)
  # -------------------------------------------------------------------
  quality-gate:
    needs: todo-list-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check version synchronization
        run: bash scripts/check-version-sync.sh

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-quality-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: ${{ runner.os }}-pip-quality-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install flake8 black mypy types-requests types-PyYAML

      - name: Lint with flake8
        run: flake8 src/ tests/

      - name: Enforce no bare except (E722)
        run: flake8 src/ tests/ --select=E722 --extend-ignore=

      - name: Check formatting with black
        run: black --check --line-length 120 src/ tests/

      - name: Type check with mypy
        run: mypy src/ --ignore-missing-imports --no-strict-optional

      - name: Validate agentic skill conformance
        run: python3 scripts/check-skill-conformance.py

      - name: Validate project manifest (.cursor/pipeline.yml)
        run: |
          pip install PyYAML
          python3 scripts/pipeline_manifest.py validate --strict

  # -------------------------------------------------------------------
  # Job 2: Unit tests
  #   - Feature/fix branches: Python 3.12 only (lowest cost)
  #   - develop/main: Python 3.11 + 3.12 matrix (full validation)
  # -------------------------------------------------------------------
  unit-tests:
    needs: quality-gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ${{ (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' || github.base_ref == 'develop' || github.base_ref == 'main') && fromJSON('["3.11", "3.12"]') || fromJSON('["3.12"]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: ${{ runner.os }}-pip-${{ matrix.python-version }}-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests with coverage
        run: |
          # Includes test_functional_validation.py: Windows charmap-safe port mapping logs,
          # network diagram PNG via PyMuPDF fallback (no placeholder), and safe exception logging.
          # Coverage threshold aligned with pyproject.toml; raise as tests expand.
          # -m "not flaky": quarantined nondeterministic tests are excluded from
          # the blocking gate and tracked as BUGs (test-reliability policy §21).
          python -m pytest tests/ -v \
            --ignore=tests/test_ui.py \
            --ignore=tests/test_integration.py \
            -m "not flaky" \
            --cov=src \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=60

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

  # -------------------------------------------------------------------
  # Job 3: Health check tests (Linux only)
  # -------------------------------------------------------------------
  health-check-tests:
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-health-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: ${{ runner.os }}-pip-health-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run health check tests
        run: |
          if [ -f tests/test_health_checker.py ]; then
            python -m pytest tests/test_health_checker.py -v --no-cov -m "not flaky"
          else
            echo "tests/test_health_checker.py not yet created -- skipping"
          fi

  # -------------------------------------------------------------------
  # Job 3.5: Advanced Operations tests (Linux only)
  # -------------------------------------------------------------------
  advanced-ops-tests:
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-advops-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: ${{ runner.os }}-pip-advops-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Advanced Operations tests
        run: |
          python -m pytest             tests/test_advanced_ops.py             tests/test_script_runner.py             tests/test_workflows.py             tests/test_result_bundler.py             tests/test_tool_manager.py             tests/test_external_port_mapper.py             -v --no-cov -m "not flaky"

    # -------------------------------------------------------------------
  # Job 4: Integration tests (Linux only)
  # -------------------------------------------------------------------
  integration-tests:
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-integration-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: ${{ runner.os }}-pip-integration-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run integration tests
        run: |
          python -m pytest tests/test_integration.py -v -m "integration and not flaky" --no-cov

  # -------------------------------------------------------------------
  # Job 4: UI tests (Playwright) — develop/main only
  #   Playwright + Chromium install is heavy; skip on feature branches
  # -------------------------------------------------------------------
  ui-tests:
    needs: quality-gate
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' || github.base_ref == 'develop' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-ui-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: ${{ runner.os }}-pip-ui-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Run UI tests
        run: |
          python -m pytest tests/test_ui.py -v --screenshot=on --output=test-results/ --no-cov

      - name: Upload test screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-screenshots
          path: test-results/

  # -------------------------------------------------------------------
  # Job 5: Build smoke test — develop/main only
  #   macOS runner = 10x Linux cost; Windows = 2x Linux cost.
  #   Only validate builds on merge-target branches.
  # -------------------------------------------------------------------
  build-smoke:
    needs: [unit-tests, integration-tests]
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' || github.base_ref == 'develop' || github.base_ref == 'main'
    strategy:
      matrix:
        include:
          - os: macos-latest
            script: bash packaging/build-mac.sh
          - os: windows-latest
            script: powershell -ExecutionPolicy Bypass -File packaging/build-windows.ps1
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\pip\Cache' || '~/Library/Caches/pip' }}
          key: ${{ runner.os }}-pip-build-${{ hashFiles('requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-build-

      - name: Install Cairo (macOS only, required for cairosvg SVG diagrams)
        if: runner.os == 'macOS'
        run: brew install cairo

      - name: Install runtime and PyInstaller
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Ensure config files exist (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path config | Out-Null
          if (!(Test-Path config/cluster_profiles.json)) { '{}' | Set-Content -Path config/cluster_profiles.json }
          # RM-1 Supplementary untracked config/config.yaml; the PyInstaller
          # spec still bundles it, so seed from the committed template.
          if (!(Test-Path config/config.yaml)) { Copy-Item config/config.yaml.template config/config.yaml }

      - name: Ensure config files exist (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          mkdir -p config
          [ -f config/cluster_profiles.json ] || echo '{}' > config/cluster_profiles.json
          # RM-1 Supplementary untracked config/config.yaml; the PyInstaller
          # spec still bundles it, so seed from the committed template.
          [ -f config/config.yaml ] || cp config/config.yaml.template config/config.yaml

      - name: Build application
        run: ${{ matrix.script }}

      - name: Verify build output
        shell: bash
        run: |
          if [ -d "dist/VAST Reporter.app" ] || [ -d "dist/VAST Reporter" ]; then
            echo "Build succeeded"
            ls -la dist/
          else
            echo "Build output not found"
            exit 1
          fi

  # -------------------------------------------------------------------
  # Job 6: Cross-OS functional QA — develop/main only (cost-gated)
  #   Runs the app's HTTP-layer functional subset (routes, in-app update
  #   pill, Teleport endpoints) run-from-source on Linux + macOS + Windows,
  #   so the same behavior is validated on all three deployment targets.
  #   Linux is the run-from-source target (no packaged artifact); mac/win
  #   also produce packaged builds via build-smoke above.
  #   cairosvg is import-guarded, so native Cairo is not required here.
  # -------------------------------------------------------------------
  qa-cross-os:
    needs: [unit-tests]
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main' || github.base_ref == 'develop' || github.base_ref == 'main'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v6
        with:
          path: ${{ runner.os == 'Windows' && '~\AppData\Local\pip\Cache' || (runner.os == 'macOS' && '~/Library/Caches/pip' || '~/.cache/pip') }}
          key: ${{ runner.os }}-pip-qa-${{ hashFiles('requirements-dev.txt') }}
          restore-keys: ${{ runner.os }}-pip-qa-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Seed gitignored config (config.yaml + cluster_profiles.json)
        shell: bash
        run: |
          mkdir -p config
          [ -f config/cluster_profiles.json ] || echo '{}' > config/cluster_profiles.json
          [ -f config/config.yaml ] || cp config/config.yaml.template config/config.yaml

      - name: Functional QA subset (routes + update pill + Teleport endpoints)
        shell: bash
        run: |
          python -m pytest \
            tests/test_app.py \
            tests/test_updater.py \
            tests/test_update_release_readiness.py \
            tests/test_functional_validation.py \
            -q --no-cov -m "not flaky"
