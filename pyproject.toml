[tool.black]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage is NOT collected by default so targeted runs stay fast and quiet. The
# coverage floor (--cov-fail-under=60, target 75%+ per TSE-9) is enforced by the
# explicit gate commands: scripts/quality-gate.sh, .cursor/pipeline.yml test_cov,
# and the ci.yml / build-release.yml pytest steps. Raise it in all of them together.
# --timeout=300: global hang backstop (pytest-timeout picks the platform method).
# No single test should run this long; combined with the tests/conftest.py network
# guard this keeps the suite hang-proof on any machine (test-reliability policy §21).
addopts = "-q -rfE --timeout=300"
markers = [
    "integration: full pipeline integration tests",
    "ui: browser-based UI tests (require Playwright)",
    "slow: tests that take more than 5 seconds",
    "flaky: quarantined nondeterministic tests; excluded from the blocking gate and tracked as a BUG to fix (pipeline test-reliability policy, §21)",
]

[tool.coverage.run]
omit = []

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101"]
